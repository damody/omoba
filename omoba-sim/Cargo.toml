[package]
name = "omoba-sim"
version = "0.1.0"
edition = "2021"
publish = false
description = "Deterministic ECS simulation crate shared between omb (server) and omfx (client) for lockstep networking"

[dependencies]
rand_pcg = "0.3"
rand_core = "0.6"
fxhash = "0.2"
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
once_cell = "1"
abi_stable = { version = "0.11", optional = true }

[features]
default = []
abi-stable = ["dep:abi_stable"]

[dev-dependencies]
proptest = "1"
