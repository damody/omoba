[package]
name = "omb-mcp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "omb-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "1.5", features = ["server", "transport-io"] }
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toon-format = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tonic-build = "0.12"
