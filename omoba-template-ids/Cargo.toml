[package]
name = "omoba-template-ids"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "Build-time generated template ids from Story/templates.json (zero runtime dependencies)"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies]
# Fixed32 用於 deterministic lockstep — 透過 abi-stable feature 取得 #[repr(transparent)]
# + StableAbi derive，generated const 透過 Fixed32::from_raw(...) 編譯期 build。
omoba-sim = { path = "../omoba-sim", features = ["abi-stable"] }
