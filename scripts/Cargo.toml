[workspace]
resolver = "2"
members = [
    "script-abi",
    "ability_kit",
    "base_content",
    # One package per hero (rlib hero_<id>_impl) and its DLL (cdylib hero_<id>), M3'.
    "heroes/*",
    "heroes/*/dll",
    # Shop items (rlib items_impl) and their DLL (cdylib items), M7.
    "items",
    "items/dll",
]

# 針對 DLL 腳本調整的發布設定檔：最佳化且不輸出 PDB / debug info。
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "none"
split-debuginfo = "off"
strip = "symbols"

[profile.release.build-override]
debug = "none"

# M3' ② 開發用熱加載（scripts/hero_hot_reload.lua）：只重編一位英雄的 DLL，求快。正式對局與
# 效能量測一律用 release。
[profile.dev-hot]
inherits = "dev"
opt-level = 1
codegen-units = 256
incremental = true
debug = "none"
