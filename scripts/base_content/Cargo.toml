[package]
name = "base_content"
version = "0.1.0"
edition = "2021"
authors = ["damody <t1238142000@gmail.com>"]
description = "omb base-game unit scripts (towers, heroes, creeps)"

[lib]
name = "base_content"
crate-type = ["cdylib"]

[lints.rust]
warnings = "allow"

[dependencies]
abi_stable = "0.11"
omb-script-abi = { path = "../script-abi" }
omoba-core = { path = "../../omoba-core", default-features = false }
omoba-template-ids = { path = "../../omoba-template-ids" }
omoba-sim = { path = "../../omoba-sim", features = ["abi-stable"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
vek = "0.17"

[features]
default = []
runtime-lua-content = ["omoba-template-ids/runtime-lua-content"]
