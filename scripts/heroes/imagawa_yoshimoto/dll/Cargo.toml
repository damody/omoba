[package]
name = "hero_b15"
version = "0.1.0"
edition = "2021"
description = "hero_b15.dll: exports hero_b15_impl's manifest (M3')"

[lib]
name = "hero_b15"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_b15_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_b15_impl/runtime-lua-content"]
compiled-content-only = ["hero_b15_impl/compiled-content-only"]
