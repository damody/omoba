[package]
name = "hero_c21"
version = "0.1.0"
edition = "2021"
description = "hero_c21.dll: exports hero_c21_impl's manifest (M3')"

[lib]
name = "hero_c21"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_c21_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_c21_impl/runtime-lua-content"]
compiled-content-only = ["hero_c21_impl/compiled-content-only"]
