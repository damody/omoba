[package]
name = "hero_b36"
version = "0.1.0"
edition = "2021"
description = "hero_b36.dll: exports hero_b36_impl's manifest (M3')"

[lib]
name = "hero_b36"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_b36_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_b36_impl/runtime-lua-content"]
compiled-content-only = ["hero_b36_impl/compiled-content-only"]
