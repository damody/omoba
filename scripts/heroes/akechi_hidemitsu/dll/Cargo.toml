[package]
name = "hero_c02"
version = "0.1.0"
edition = "2021"
description = "hero_c02.dll: exports hero_c02_impl's manifest (M3')"

[lib]
name = "hero_c02"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_c02_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_c02_impl/runtime-lua-content"]
compiled-content-only = ["hero_c02_impl/compiled-content-only"]
