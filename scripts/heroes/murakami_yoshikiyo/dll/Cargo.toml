[package]
name = "hero_b29"
version = "0.1.0"
edition = "2021"
description = "hero_b29.dll: exports hero_b29_impl's manifest (M3')"

[lib]
name = "hero_b29"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_b29_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_b29_impl/runtime-lua-content"]
compiled-content-only = ["hero_b29_impl/compiled-content-only"]
