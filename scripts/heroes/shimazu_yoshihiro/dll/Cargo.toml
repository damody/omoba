[package]
name = "hero_c03"
version = "0.1.0"
edition = "2021"
description = "hero_c03.dll: exports hero_c03_impl's manifest (M3')"

[lib]
name = "hero_c03"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_c03_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_c03_impl/runtime-lua-content"]
compiled-content-only = ["hero_c03_impl/compiled-content-only"]
