[package]
name = "hero_a31"
version = "0.1.0"
edition = "2021"
description = "hero_a31.dll: exports hero_a31_impl's manifest (M3')"

[lib]
name = "hero_a31"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_a31_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_a31_impl/runtime-lua-content"]
compiled-content-only = ["hero_a31_impl/compiled-content-only"]
