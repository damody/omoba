[package]
name = "hero_b11"
version = "0.1.0"
edition = "2021"
description = "hero_b11.dll: exports hero_b11_impl's manifest (M3')"

[lib]
name = "hero_b11"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_b11_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_b11_impl/runtime-lua-content"]
compiled-content-only = ["hero_b11_impl/compiled-content-only"]
