[package]
name = "hero_a35"
version = "0.1.0"
edition = "2021"
description = "hero_a35.dll: exports hero_a35_impl's manifest (M3')"

[lib]
name = "hero_a35"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_a35_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_a35_impl/runtime-lua-content"]
compiled-content-only = ["hero_a35_impl/compiled-content-only"]
