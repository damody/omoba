[package]
name = "hero_b31"
version = "0.1.0"
edition = "2021"
description = "hero_b31.dll: exports hero_b31_impl's manifest (M3')"

[lib]
name = "hero_b31"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_b31_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_b31_impl/runtime-lua-content"]
compiled-content-only = ["hero_b31_impl/compiled-content-only"]
