[package]
name = "hero_a02_impl"
version = "0.1.0"
edition = "2021"
authors = ["damody <t1238142000@gmail.com>"]
description = "A02 (inahime) ability scripts generated from docs/character_pipeline/packages/inahime/v3.lua; dll/ builds them into hero_a02.dll (M3')"

[lib]
name = "hero_a02_impl"
# rlib only: base_content's tests link it in-process. The DLL is the separate package in dll/,
# which nothing depends on, so a test build never rewrites hero_a02.dll without its root module.
crate-type = ["rlib"]

[dependencies]
abi_stable = "0.11"
ability_kit = { path = "../../ability_kit" }
# legacy-handlers only (the hand-written handlers kept for the replay comparison, M3' ④).
omb-script-abi = { path = "../../script-abi", optional = true }
omoba-core = { path = "../../../omoba-core", default-features = false, optional = true }
omoba-template-ids = { path = "../../../omoba-template-ids", optional = true }
omoba-sim = { path = "../../../omoba-sim", features = ["abi-stable"], optional = true }
serde_json = { version = "1.0", optional = true }

[features]
default = []
runtime-lua-content = ["ability_kit/runtime-lua-content"]
compiled-content-only = ["ability_kit/compiled-content-only"]
legacy-handlers = ["dep:omb-script-abi", "dep:omoba-core", "dep:omoba-template-ids", "dep:omoba-sim", "dep:serde_json"]

[dev-dependencies]
specs = { path = "../../../specs" }
omoba-core = { path = "../../../omoba-core", default-features = false, features = ["kcp", "test-support"] }
