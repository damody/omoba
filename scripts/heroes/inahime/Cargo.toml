[package]
name = "hero_a02_impl"
version = "0.1.0"
edition = "2021"
authors = ["damody <t1238142000@gmail.com>"]
description = "A02 (inahime) ability scripts generated from docs/character_pipeline/packages/inahime/v3.lua; dll/ builds them into hero_a02.dll (M3')"

[lib]
name = "hero_a02_impl"
# rlib only: base_content's tests link it in-process. The DLL is the separate package in dll/,
# which nothing depends on, so a test build never rewrites hero_a02.dll without its root module.
crate-type = ["rlib"]

[dependencies]
abi_stable = "0.11"
ability_kit = { path = "../../ability_kit" }

[features]
default = []
runtime-lua-content = ["ability_kit/runtime-lua-content"]
compiled-content-only = ["ability_kit/compiled-content-only"]

[dev-dependencies]
specs = { path = "../../../specs" }
omoba-core = { path = "../../../omoba-core", default-features = false, features = ["kcp", "test-support"] }
