[package]
name = "hero_a03"
version = "0.1.0"
edition = "2021"
description = "hero_a03.dll: exports hero_a03_impl's manifest (M3')"

[lib]
name = "hero_a03"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_a03_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_a03_impl/runtime-lua-content"]
compiled-content-only = ["hero_a03_impl/compiled-content-only"]
