[package]
name = "hero_b21"
version = "0.1.0"
edition = "2021"
description = "hero_b21.dll: exports hero_b21_impl's manifest (M3')"

[lib]
name = "hero_b21"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_b21_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_b21_impl/runtime-lua-content"]
compiled-content-only = ["hero_b21_impl/compiled-content-only"]
