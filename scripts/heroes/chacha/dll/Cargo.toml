[package]
name = "hero_c25"
version = "0.1.0"
edition = "2021"
description = "hero_c25.dll: exports hero_c25_impl's manifest (M3')"

[lib]
name = "hero_c25"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_c25_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_c25_impl/runtime-lua-content"]
compiled-content-only = ["hero_c25_impl/compiled-content-only"]
