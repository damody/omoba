[package]
name = "hero_b10"
version = "0.1.0"
edition = "2021"
description = "hero_b10.dll: exports hero_b10_impl's manifest (M3')"

[lib]
name = "hero_b10"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_b10_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_b10_impl/runtime-lua-content"]
compiled-content-only = ["hero_b10_impl/compiled-content-only"]
