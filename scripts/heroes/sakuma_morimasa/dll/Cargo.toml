[package]
name = "hero_a24"
version = "0.1.0"
edition = "2021"
description = "hero_a24.dll: exports hero_a24_impl's manifest (M3')"

[lib]
name = "hero_a24"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_a24_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_a24_impl/runtime-lua-content"]
compiled-content-only = ["hero_a24_impl/compiled-content-only"]
