[package]
name = "hero_b33"
version = "0.1.0"
edition = "2021"
description = "hero_b33.dll: exports hero_b33_impl's manifest (M3')"

[lib]
name = "hero_b33"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_b33_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_b33_impl/runtime-lua-content"]
compiled-content-only = ["hero_b33_impl/compiled-content-only"]
