[package]
name = "hero_a27"
version = "0.1.0"
edition = "2021"
description = "hero_a27.dll: exports hero_a27_impl's manifest (M3')"

[lib]
name = "hero_a27"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_a27_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_a27_impl/runtime-lua-content"]
compiled-content-only = ["hero_a27_impl/compiled-content-only"]
