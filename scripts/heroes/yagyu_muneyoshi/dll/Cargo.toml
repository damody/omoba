[package]
name = "hero_c24"
version = "0.1.0"
edition = "2021"
description = "hero_c24.dll: exports hero_c24_impl's manifest (M3')"

[lib]
name = "hero_c24"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_c24_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_c24_impl/runtime-lua-content"]
compiled-content-only = ["hero_c24_impl/compiled-content-only"]
