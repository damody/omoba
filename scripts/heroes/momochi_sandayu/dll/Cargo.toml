[package]
name = "hero_b13"
version = "0.1.0"
edition = "2021"
description = "hero_b13.dll: exports hero_b13_impl's manifest (M3')"

[lib]
name = "hero_b13"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_b13_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_b13_impl/runtime-lua-content"]
compiled-content-only = ["hero_b13_impl/compiled-content-only"]
