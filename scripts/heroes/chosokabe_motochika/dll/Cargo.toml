[package]
name = "hero_c20"
version = "0.1.0"
edition = "2021"
description = "hero_c20.dll: exports hero_c20_impl's manifest (M3')"

[lib]
name = "hero_c20"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_c20_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_c20_impl/runtime-lua-content"]
compiled-content-only = ["hero_c20_impl/compiled-content-only"]
