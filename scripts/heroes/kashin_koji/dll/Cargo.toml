[package]
name = "hero_c16"
version = "0.1.0"
edition = "2021"
description = "hero_c16.dll: exports hero_c16_impl's manifest (M3')"

[lib]
name = "hero_c16"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_c16_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_c16_impl/runtime-lua-content"]
compiled-content-only = ["hero_c16_impl/compiled-content-only"]
