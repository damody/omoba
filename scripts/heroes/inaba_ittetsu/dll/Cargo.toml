[package]
name = "hero_a18"
version = "0.1.0"
edition = "2021"
description = "hero_a18.dll: exports hero_a18_impl's manifest (M3')"

[lib]
name = "hero_a18"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_a18_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_a18_impl/runtime-lua-content"]
compiled-content-only = ["hero_a18_impl/compiled-content-only"]
