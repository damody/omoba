[package]
name = "hero_c19"
version = "0.1.0"
edition = "2021"
description = "hero_c19.dll: exports hero_c19_impl's manifest (M3')"

[lib]
name = "hero_c19"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_c19_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_c19_impl/runtime-lua-content"]
compiled-content-only = ["hero_c19_impl/compiled-content-only"]
