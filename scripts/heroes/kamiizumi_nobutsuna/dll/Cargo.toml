[package]
name = "hero_b35"
version = "0.1.0"
edition = "2021"
description = "hero_b35.dll: exports hero_b35_impl's manifest (M3')"

[lib]
name = "hero_b35"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_b35_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_b35_impl/runtime-lua-content"]
compiled-content-only = ["hero_b35_impl/compiled-content-only"]
