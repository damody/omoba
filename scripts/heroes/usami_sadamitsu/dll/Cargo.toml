[package]
name = "hero_b19"
version = "0.1.0"
edition = "2021"
description = "hero_b19.dll: exports hero_b19_impl's manifest (M3')"

[lib]
name = "hero_b19"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_b19_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_b19_impl/runtime-lua-content"]
compiled-content-only = ["hero_b19_impl/compiled-content-only"]
