[package]
name = "hero_a08"
version = "0.1.0"
edition = "2021"
description = "hero_a08.dll: exports hero_a08_impl's manifest (M3')"

[lib]
name = "hero_a08"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_a08_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_a08_impl/runtime-lua-content"]
compiled-content-only = ["hero_a08_impl/compiled-content-only"]
