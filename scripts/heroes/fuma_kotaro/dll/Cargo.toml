[package]
name = "hero_b02"
version = "0.1.0"
edition = "2021"
description = "hero_b02.dll: exports hero_b02_impl's manifest (M3')"

[lib]
name = "hero_b02"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_b02_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_b02_impl/runtime-lua-content"]
compiled-content-only = ["hero_b02_impl/compiled-content-only"]
