[package]
name = "hero_a12"
version = "0.1.0"
edition = "2021"
description = "hero_a12.dll: exports hero_a12_impl's manifest (M3')"

[lib]
name = "hero_a12"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_a12_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_a12_impl/runtime-lua-content"]
compiled-content-only = ["hero_a12_impl/compiled-content-only"]
