[package]
name = "hero_c12"
version = "0.1.0"
edition = "2021"
description = "hero_c12.dll: exports hero_c12_impl's manifest (M3')"

[lib]
name = "hero_c12"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_c12_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_c12_impl/runtime-lua-content"]
compiled-content-only = ["hero_c12_impl/compiled-content-only"]
