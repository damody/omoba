[package]
name = "hero_a21"
version = "0.1.0"
edition = "2021"
description = "hero_a21.dll: exports hero_a21_impl's manifest (M3')"

[lib]
name = "hero_a21"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_a21_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_a21_impl/runtime-lua-content"]
compiled-content-only = ["hero_a21_impl/compiled-content-only"]
