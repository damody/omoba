[package]
name = "hero_a32"
version = "0.1.0"
edition = "2021"
description = "hero_a32.dll: exports hero_a32_impl's manifest (M3')"

[lib]
name = "hero_a32"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_a32_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_a32_impl/runtime-lua-content"]
compiled-content-only = ["hero_a32_impl/compiled-content-only"]
