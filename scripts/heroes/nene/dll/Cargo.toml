[package]
name = "hero_a15"
version = "0.1.0"
edition = "2021"
description = "hero_a15.dll: exports hero_a15_impl's manifest (M3')"

[lib]
name = "hero_a15"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_a15_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_a15_impl/runtime-lua-content"]
compiled-content-only = ["hero_a15_impl/compiled-content-only"]
