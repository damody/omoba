[package]
name = "hero_b12"
version = "0.1.0"
edition = "2021"
description = "hero_b12.dll: exports hero_b12_impl's manifest (M3')"

[lib]
name = "hero_b12"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_b12_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_b12_impl/runtime-lua-content"]
compiled-content-only = ["hero_b12_impl/compiled-content-only"]
