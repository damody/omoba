[package]
name = "hero_b30"
version = "0.1.0"
edition = "2021"
description = "hero_b30.dll: exports hero_b30_impl's manifest (M3')"

[lib]
name = "hero_b30"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_b30_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_b30_impl/runtime-lua-content"]
compiled-content-only = ["hero_b30_impl/compiled-content-only"]
