[package]
name = "hero_b04_impl"
version = "0.1.0"
edition = "2021"
description = "B04 (date_masamune) ability scripts generated from docs/character_pipeline/packages/date_masamune/v3.lua (M3' ④: base_content links fire blast and flame swiftness; B04's own DLL waits for M5)"

[lib]
name = "hero_b04_impl"
# rlib only: base_content's tests link it in-process. The DLL is the separate package in dll/.
crate-type = ["rlib"]

[dependencies]
abi_stable = "0.11"
ability_kit = { path = "../../ability_kit" }

[features]
default = []
runtime-lua-content = ["ability_kit/runtime-lua-content"]
compiled-content-only = ["ability_kit/compiled-content-only"]
