[package]
name = "hero_c14"
version = "0.1.0"
edition = "2021"
description = "hero_c14.dll: exports hero_c14_impl's manifest (M3')"

[lib]
name = "hero_c14"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_c14_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_c14_impl/runtime-lua-content"]
compiled-content-only = ["hero_c14_impl/compiled-content-only"]
