[package]
name = "hero_a14"
version = "0.1.0"
edition = "2021"
description = "hero_a14.dll: exports hero_a14_impl's manifest (M3')"

[lib]
name = "hero_a14"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_a14_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_a14_impl/runtime-lua-content"]
compiled-content-only = ["hero_a14_impl/compiled-content-only"]
