[package]
name = "hero_c05"
version = "0.1.0"
edition = "2021"
description = "hero_c05.dll: exports hero_c05_impl's manifest (M3')"

[lib]
name = "hero_c05"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_c05_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_c05_impl/runtime-lua-content"]
compiled-content-only = ["hero_c05_impl/compiled-content-only"]
