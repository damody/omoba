[package]
name = "hero_a26"
version = "0.1.0"
edition = "2021"
description = "hero_a26.dll: exports hero_a26_impl's manifest (M3')"

[lib]
name = "hero_a26"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_a26_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_a26_impl/runtime-lua-content"]
compiled-content-only = ["hero_a26_impl/compiled-content-only"]
