[package]
name = "hero_b17"
version = "0.1.0"
edition = "2021"
description = "hero_b17.dll: exports hero_b17_impl's manifest (M3')"

[lib]
name = "hero_b17"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_b17_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_b17_impl/runtime-lua-content"]
compiled-content-only = ["hero_b17_impl/compiled-content-only"]
