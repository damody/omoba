[package]
name = "hero_b22"
version = "0.1.0"
edition = "2021"
description = "hero_b22.dll: exports hero_b22_impl's manifest (M3')"

[lib]
name = "hero_b22"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_b22_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_b22_impl/runtime-lua-content"]
compiled-content-only = ["hero_b22_impl/compiled-content-only"]
