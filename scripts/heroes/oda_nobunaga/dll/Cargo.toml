[package]
name = "hero_a25"
version = "0.1.0"
edition = "2021"
description = "hero_a25.dll: exports hero_a25_impl's manifest (M3')"

[lib]
name = "hero_a25"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_a25_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_a25_impl/runtime-lua-content"]
compiled-content-only = ["hero_a25_impl/compiled-content-only"]
