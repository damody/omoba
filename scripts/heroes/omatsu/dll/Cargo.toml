[package]
name = "hero_a34"
version = "0.1.0"
edition = "2021"
description = "hero_a34.dll: exports hero_a34_impl's manifest (M3')"

[lib]
name = "hero_a34"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_a34_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_a34_impl/runtime-lua-content"]
compiled-content-only = ["hero_a34_impl/compiled-content-only"]
