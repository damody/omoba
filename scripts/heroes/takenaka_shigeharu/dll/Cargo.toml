[package]
name = "hero_a04"
version = "0.1.0"
edition = "2021"
description = "hero_a04.dll: exports hero_a04_impl's manifest (M3')"

[lib]
name = "hero_a04"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_a04_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_a04_impl/runtime-lua-content"]
compiled-content-only = ["hero_a04_impl/compiled-content-only"]
