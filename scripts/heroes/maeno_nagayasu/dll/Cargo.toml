[package]
name = "hero_a36"
version = "0.1.0"
edition = "2021"
description = "hero_a36.dll: exports hero_a36_impl's manifest (M3')"

[lib]
name = "hero_a36"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
hero_a36_impl = { path = ".." }

[features]
default = []
runtime-lua-content = ["hero_a36_impl/runtime-lua-content"]
compiled-content-only = ["hero_a36_impl/compiled-content-only"]
