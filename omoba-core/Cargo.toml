[package]
name = "omoba-core"
version = "0.1.0"
edition = "2021"
description = "Shared core library for OMOBA frontends"

[dependencies]
# MQTT客戶端
rumqttc = { version = "0.24", optional = true }

# 非同步運行時。`rt` is wasm-compatible; native binaries can still run a
# multi-thread runtime from their own crate.
tokio = { version = "1.0", features = ["rt", "sync", "macros", "time"] }

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 設定
toml = "0.9"

# 日誌
log = "0.4"

# 數學
vek = { version = "0.17", features = ["serde"] }

# 錯誤處理
anyhow = "1.0"

# gRPC 用戶端
tonic = { version = "0.12", optional = true }
prost = "0.13"
tokio-stream = { version = "0.1", optional = true }

# KCP客戶端
tokio_kcp = { version = "0.9", optional = true }

# LZ4 壓縮（由 kcp 成幀使用）
lz4_flex = { version = "0.11", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native shared deterministic runtime used by omb and native omfx.
failure = "0.1.8"
specs = { path = "../specs", features = ["derive", "parallel", "serde"] }
omoba-sim = { path = "../omoba-sim", features = ["abi-stable"] }
omb-script-abi = { path = "../scripts/script-abi" }
hashbrown = "0.15"
instant-distance = "0.6.0"
ordered-float = "5.0"
abi_stable = "0.11"
rand = "0.9"
rand_pcg = "0.9"
crossbeam-channel = "0.5"
rayon = "1.10"
num_cpus = "1.16"
rust_decimal = "1.33"
regex = "1.0"
lazy_static = "1.4"
tracing = "0.1"
voracious_radix_sort = { version = "1.2.0", features = ["voracious_multithread"] }
# 模板 ID（建置時從 Story/templates.json 產生）
omoba-template-ids = { path = "../omoba-template-ids" }

[build-dependencies]
tonic-build = { version = "0.12", optional = true }
prost-build = "0.13"

[features]
default = ["kcp"]
mqtt = ["rumqttc"]
grpc = ["tonic", "tokio-stream", "tonic-build"]
game-proto = []
kcp = ["game-proto", "tokio_kcp", "tokio/net", "tokio/io-util", "dep:lz4_flex"]
tracy = []
runtime-lua-content = ["omoba-template-ids/runtime-lua-content"]
