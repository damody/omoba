[package]
name = "omoba-core"
version = "0.1.0"
edition = "2021"
description = "Shared core library for OMOBA frontends"

[dependencies]
# MQTT客戶端
rumqttc = { version = "0.24", optional = true }

# 非同步運行時
tokio = { version = "1.0", features = ["rt-multi-thread", "sync", "macros", "time"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
toml = "0.9"

# Logging
log = "0.4"

# Math
vek = "0.17"

# 錯誤處理
anyhow = "1.0"

# 隨機（用於玩家模擬）
rand = "0.9"

# gRPC 用戶端
tonic = { version = "0.12", optional = true }
prost = { version = "0.13", optional = true }
tokio-stream = { version = "0.1", optional = true }

# KCP客戶端
tokio_kcp = { version = "0.9", optional = true }

# LZ4 壓縮（由 kcp 成幀使用）
lz4_flex = { version = "0.11", optional = true }

# 模板 ID（建置時從 Story/templates.json 產生）
omoba-template-ids = { path = "../omoba-template-ids" }

[build-dependencies]
tonic-build = { version = "0.12", optional = true }
prost-build = { version = "0.13", optional = true }

[features]
default = ["kcp"]
mqtt = ["rumqttc"]
grpc = ["tonic", "prost", "tokio-stream", "tonic-build"]
kcp = ["tokio_kcp", "prost", "prost-build", "tokio/net", "tokio/io-util", "dep:lz4_flex"]
