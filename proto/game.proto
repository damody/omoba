syntax = "proto3";

package game;

service GameService {
  // Player sends a command to the game server
  rpc SendCommand(PlayerCommand) returns (CommandAck);

  // Subscribe to game events (server-streaming)
  rpc SubscribeEvents(SubscribeRequest) returns (stream GameEvent);

  // Test interface for automated testing
  rpc TestCommand(TestCommandRequest) returns (TestCommandResponse);

  // Query game state (used by MCP server)
  rpc QueryGameState(GameStateRequest) returns (GameStateResponse);
}

// Corresponds to PlayerData / InboundMsg
message PlayerCommand {
  string player_name = 1;
  string msg_type = 2;   // "t" field
  string action = 3;     // "a" field
  bytes  data_json = 4;  // "d" field as JSON bytes
}

message CommandAck {
  bool   ok = 1;
  string message = 2;
}

message SubscribeRequest {
  string player_name = 1;
}

// ===== Quantization primitives (P2) =====
// All quantized scalars use explicit scale constants (see omoba-core/src/quant.rs):
//   Position16: scale=0.25, range ±8191.75 world units, precision 0.25 px
//   Fixed16:    scale=0.1, wire=sint32 (varint, 1-5 B). HP/damage/armor/move_speed.
//               不再 clamp 到 i16；典型值仍 2-byte varint，極端值（stress 10M HP）走 5 byte。
//   Facing8:    256 steps across 0..2π, precision ~1.4°
//
// Use sint32 in proto3 (varint encoded) — typical sub-20 values fit in 1~2 bytes.
message Position16 {
  sint32 x_q = 1;  // value * 0.25 = world x
  sint32 y_q = 2;
}

message Fixed16 {
  sint32 v_q = 1;  // value * 0.1 = real value
}

// ===== Typed event payloads (P2) =====
// Populated when a given event kind has been migrated off JSON. Clients
// check `GameEvent.typed_payload` first; if unset, fall back to `data_json`.

message HeartbeatEntry {
  uint64 id = 1;      // entity index (specs::Entity::id)
  Fixed16 hp = 2;     // current HP only; client caches max_hp from creation events
}

message HeartbeatPosEntry {
  uint64 id = 1;
  Position16 pos = 2;
}

message HeartbeatTick {
  uint64 tick = 1;
  double game_time = 2;       // total seconds since scenario start
  uint32 entity_count = 3;    // global: heroes + units + creeps (sanity UI)
  uint32 hero_count = 4;
  uint32 unit_count = 5;
  uint32 creep_count = 6;
  uint32 render_delay_ms = 7;
  repeated HeartbeatEntry hp_snapshot = 8;  // viewport-filtered per-player
  // P4: viewport-filtered 10% position sample for drift correction on the
  // client (velocity extrapolation accumulates error over seconds).
  repeated HeartbeatPosEntry pos_snapshot = 9;
  // P7 layered: still-alive predeclared-damage projectile ids targeting
  // entities visible to this player. Client uses this set to retain its
  // pending_pred_dmg map (any pending entry whose proj_id is NOT in this
  // set has been settled server-side and is already reflected in
  // hp_snapshot — drop it). Filtered to non-AOE non-directional shots
  // (radius < 1.0 && damage_phys > 0) since those are the only ones whose
  // damage was pre-declared in ProjectileCreate.damage.
  repeated uint32 in_flight_projectiles = 10;
}

// ===== Projectile events =====

message ProjectileCreate {
  uint64 id = 1;
  uint64 target_id = 2;        // 0 if no target
  Position16 start_pos = 3;
  Position16 end_pos = 4;      // computed target point (for linear travel)
  uint32 flight_time_ms = 5;
  bool directional = 6;        // true = positional travel; false = seeking
  Fixed16 splash_radius = 7;   // 0 = point damage
  Fixed16 hit_radius = 8;      // hit test radius, 0 = point
  // Template id — sequential u16 from `omoba_template_ids::ProjectileKindId`.
  // Source: `omb/Story/templates.json` `projectile_kinds[]`. 0 = UNSPECIFIED.
  // Wire: uint32 varint (u16 fits in 1-3 bytes typically).
  uint32 kind_id = 9;
  // P7: pre-declared damage for single-target projectiles. When splash_radius
  // is 0 (not AOE) and target_id is set, server pre-computes the damage here
  // so client can apply HP update locally at impact time, eliminating a
  // creep.H round-trip. For AOE projectiles this is 0 and server still emits
  // creep.H per-target on impact.
  Fixed16 damage = 10;
}

message ProjectileDestroy {
  uint64 id = 1;
}

// ===== Creep events =====

message CreepCreate {
  uint64 id = 1;
  Position16 pos = 2;
  Fixed16 hp = 3;
  Fixed16 max_hp = 4;
  Fixed16 move_speed = 5;
  // Template id — sequential u16 from `omoba_template_ids::CreepId`.
  // Source: `omb/Story/templates.json` `creeps[]`. 0 = UNSPECIFIED.
  // Client reverse-looks up display name via `creep_display(CreepId)`.
  uint32 name_id = 6;
  reserved 7;                  // was `string template_key`; dropped (never populated)
}

message CreepMove {
  uint64 id = 1;
  Position16 target = 2;       // current waypoint / move target
  uint32 facing_q = 3;         // Facing8
  // P4: velocity-based extrapolation. Server now emits CreepMove only on
  // waypoint / state change; the client extrapolates current position as
  //     start_pos + (now_tick - start_tick) * dt * velocity * direction
  // between events, with drift correction from heartbeat pos_snapshot.
  Fixed16 velocity = 4;        // world units per second (== creep.msd at emit time)
  uint64 arrival_tick = 5;     // server tick when creep reaches target (0 = unknown)
  Position16 start_pos = 6;    // server-authoritative start position (for extrapolation anchor)
  uint64 start_tick = 7;       // server tick when this move segment began
}

message CreepHp {
  uint64 id = 1;
  Fixed16 hp = 2;
  EntityKind kind = 3;     // dynamic — creep/hero/unit/entity (default = entity)
}

message CreepSlow {
  uint64 id = 1;
  Fixed16 move_speed = 2;
}

message EntityFacing {
  uint64 id = 1;
  uint32 facing_q = 2;         // Facing8
}

// Entity kind enum used by EntityDeath / CreepHp to disambiguate dynamic kinds.
// 0 = unspecified → client shim treats as legacy "entity".
enum EntityKind {
  ENTITY_KIND_UNSPECIFIED = 0;
  ENTITY_KIND_CREEP = 1;
  ENTITY_KIND_HERO = 2;
  ENTITY_KIND_TOWER = 3;
  ENTITY_KIND_UNIT = 4;
  ENTITY_KIND_PROJECTILE = 5;
  ENTITY_KIND_ENTITY = 6;   // generic catch-all — matches legacy "entity" msg_type
}

// Shared death for hero/creep/unit/tower (client routes on `kind` field).
message EntityDeath {
  uint64 id = 1;
  EntityKind kind = 2;     // 0 = unspecified → ("entity", "D")
}

// Creep temporarily blocked by collision (hero/creep/tower stall feedback).
message CreepStall {
  uint64 id = 1;
  Position16 pos = 2;
  uint32 facing_q = 3;
}

// ===== Tower events =====

message TowerCreate {
  uint64 id = 1;
  Position16 pos = 2;
  Fixed16 hp = 3;
  Fixed16 max_hp = 4;
  string kind = 5;             // template key (e.g. "dart_tower")
  string name = 6;              // display label
}

message TowerUpgrade {
  uint64 id = 1;
  repeated uint32 levels = 2;  // 3 path levels [p0, p1, p2]
}

// ===== Hero events =====

message AbilityLevelPair {
  uint32 cur = 1;
  uint32 max = 2;
}

message BuffSnapshot {
  string buff_id = 1;
  // u16 milliseconds, 0..=65535. 0xFFFF sentinel = toggle-type / infinite.
  uint32 remaining_ms = 2;
  string payload_json = 3;     // arbitrary modifier data (usually small)
}

// Minimal hero create — for visibility-diff / spawn. Static and Hot are pushed
// alongside (or shortly after) so omfx can hydrate full hero state.
message HeroCreate {
  uint64 id = 1;
  Position16 pos = 2;
  Fixed16 hp = 3;
  Fixed16 max_hp = 4;
  string name = 5;            // hero display name
  string title = 6;           // hero title
}

// Generic unit create — for visibility-diff and summon spawn.
message UnitCreate {
  uint64 id = 1;
  Position16 pos = 2;
  Fixed16 hp = 3;
  Fixed16 max_hp = 4;
  string name = 5;            // unit type label (e.g. "saika_gunner")
}

// Catch-all wrapper for low-frequency irregular events (init/ack/reject/inventory)
// that don't justify a typed proto variant. Steady-state emit rate is ~0.
message LegacyJson {
  string msg_type = 1;
  string action = 2;
  bytes data_json = 3;
}

// Static hero metadata — pushed on create / level up / ability learn.
message HeroStatic {
  uint64 id = 1;
  string name = 2;
  string title = 3;
  uint32 base_str = 4;
  uint32 base_agi = 5;
  uint32 base_int = 6;
  repeated string ability_ids = 7;
  uint32 level = 8;
  uint32 xp = 9;
  uint32 xp_next = 10;
  uint32 skill_points = 11;
  repeated AbilityLevelPair ability_levels = 12;
}

// Hot hero state — pushed every 0.3s.
message HeroHot {
  uint64 id = 1;
  Fixed16 hp = 2;
  Fixed16 max_hp = 3;
  Fixed16 mana = 4;
  Fixed16 max_mana = 5;
  uint32 gold = 6;
  Fixed16 attack_damage = 7;
  Fixed16 armor = 8;
  Fixed16 magic_resist = 9;
  Fixed16 move_speed = 10;
  Fixed16 attack_range = 11;
  Fixed16 attack_interval = 12;
  repeated BuffSnapshot buffs = 13;
}

// ===== Buff events =====

message BuffAdd {
  uint64 entity_id = 1;
  string buff_id = 2;
  uint32 remaining_ms = 3;
  string payload_json = 4;
}

message BuffRemove {
  uint64 entity_id = 1;
  string buff_id = 2;
}

// ===== Game meta =====

message GameRound {
  uint32 round = 1;
  uint32 total = 2;
  bool is_running = 3;
}

message GameLives {
  int32 lives = 1;
}

message GameEnd {
  string winner = 1;
}

message GameExplosion {
  Position16 pos = 1;
  Fixed16 radius = 2;
  uint32 duration_ms = 3;
}

// P9: GameEvent envelope stripped. The original `topic`, `msg_type`, `action`,
// `data_json`, `timestamp_ms` fields are gone. Routing/dedupe/urgency/counter
// is server-side only and uses the variant tag of `payload`. Clients reconstruct
// (msg_type, action) from the variant via a compile-time exhaustive shim.
//
// Field 1 used to be `topic`; it's now `sequence` (proto3 wire format-compatible
// with the previous `sequence = 6` field semantically — this is a hard schema
// break, all clients must be rebuilt).
message GameEvent {
  // P6: per-session monotonic sequence. Server's broadcast thread stamps this
  // on each GameEvent before the frame is encoded for a given client. Clients
  // compare against their last-known sequence and request a snapshot via
  // TAG_GAME_STATE_REQUEST (query_type = "seq-gap") when a gap is detected.
  uint64 sequence = 1;
  // Reserved tags formerly used by envelope fields (topic/msg_type/action/data_json/timestamp_ms).
  reserved 2 to 9;
  oneof payload {
    HeartbeatTick heartbeat = 10;

    // Hero events (11..=19)
    HeroStatic hero_static = 11;
    HeroHot hero_hot = 12;
    HeroCreate hero_create = 13;       // P9 visibility-diff create

    // Creep / entity events (20..=29)
    CreepCreate creep_create = 20;
    CreepMove creep_move = 21;
    CreepHp creep_hp = 22;             // now carries EntityKind
    CreepSlow creep_slow = 23;
    CreepStall creep_stall = 24;
    EntityFacing entity_facing = 25;
    EntityDeath entity_death = 26;     // now carries EntityKind
    UnitCreate unit_create = 27;       // P9 visibility-diff + summon

    // Projectile events (30..=33)
    ProjectileCreate projectile_create = 30;
    ProjectileDestroy projectile_destroy = 31;

    // Tower events (34..=39)
    TowerCreate tower_create = 34;
    TowerUpgrade tower_upgrade = 35;

    // Buff events (40..=44)
    BuffAdd buff_add = 40;
    BuffRemove buff_remove = 41;

    // Game meta events (45..=49)
    GameRound game_round = 45;
    GameLives game_lives = 46;
    GameEnd game_end = 47;
    GameExplosion game_explosion = 48;

    // P9 catch-all for low-frequency init / ack / reject / inventory events
    // that don't justify a typed variant. Wire shape mirrors the old envelope
    // fields but is gated behind a varint tag so steady-state hot-paths pay 0.
    LegacyJson legacy_json = 60;
  }
}

// ===== Phase 2 Lockstep Quantized Primitives =====
//
// Vec2I / FixedI carry Fixed32 raw values (1024 raw = 1.0 unit) for
// lossless wire transmission of sim state. Distinct from legacy
// Position16 / Fixed16 which use 0.25 / 0.1 quantization for compactness.

message Vec2I {
  sint32 x = 1;  // Fixed32::raw() — divide by 1024 to get real units
  sint32 y = 2;
}

message FixedI {
  sint32 raw = 1;  // Fixed32::raw()
}

message AngleI {
  sint32 ticks = 1;  // omoba_sim::Angle::ticks() in [0, 4096)
}

// ===== PlayerInput =====

message NoOp {}

message MoveTo {
  Vec2I target = 1;  // world position to move toward
  bool queued = 2;   // append to the hero command queue when Shift is held
}

message AttackTarget {
  uint32 target_id = 1;  // entity id
  bool queued = 2;       // append to the hero command queue when Shift is held
}

message AttackMove {
  Vec2I target = 1;  // world position to attack-move toward
  bool queued = 2;   // append to the hero command queue when Shift is held
}

enum TargetPriority {
  TARGET_PRIORITY_FIRST = 0;
  TARGET_PRIORITY_LAST = 1;
  TARGET_PRIORITY_NEAREST = 2;
  TARGET_PRIORITY_FARTHEST = 3;
  TARGET_PRIORITY_HIGHEST_HEALTH = 4;
  TARGET_PRIORITY_LOWEST_HEALTH = 5;
}

message SetTowerTargetPriority {
  uint32 tower_entity_id = 1;
  TargetPriority priority = 2;
}

message CastAbility {
  uint32 ability_index = 1;  // Q/W/E/R 對應 0..3
  // optional 施法位置；self-cast 時省略
  optional Vec2I target_pos = 2;
  optional uint32 target_entity = 3;
}

message UpgradeAbility {
  uint32 ability_index = 1;  // W/E/R/T 升級 slot 對應 0..3
}

message TowerPlace {
  uint32 tower_kind_id = 1;  // 對應 omoba_template_ids tower id
  Vec2I pos = 2;
}

// NOTE：legacy `TowerUpgrade`（上方，作為 GameEvent.payload tag 35 的
// server-broadcast event）保留原名。新的 client→server input action 命名為
// `TowerUpgradeInput`，避免 proto3 namespace collision。
message TowerUpgradeInput {
  uint32 tower_entity_id = 1;
  uint32 path = 2;       // 0/1/2 upgrade path
  uint32 level = 3;      // 升級後的目標 level
}

message TowerSell {
  uint32 tower_entity_id = 1;
}

message ItemUse {
  uint32 item_slot = 1;  // inventory slot index
  optional Vec2I target_pos = 2;
  optional uint32 target_entity = 3;
}

// TD：client 請求開始下一波 creep wave（legacy "Start Round"）。
// Server 會切換 `CurrentCreepWave.is_running = true` 並寫入 wave_start_time。
message StartRound {}

// Client requests toggling the authoritative simulation pause state.
// The input remains lockstep-driven so all replicas pause/resume on the same tick.
message TogglePause {}

// Client requests toggling authoritative simulation speed between 1x and 2x.
// The input is lockstep-driven so all replicas apply the speed on the same tick.
message ToggleGameSpeed {}

message PlayerInput {
  oneof action {
    NoOp no_op = 1;
    MoveTo move_to = 2;
    AttackTarget attack_target = 3;
    CastAbility cast_ability = 4;
    TowerPlace tower_place = 5;
    TowerUpgradeInput tower_upgrade = 6;
    TowerSell tower_sell = 7;
    ItemUse item_use = 8;
    StartRound start_round = 9;
    UpgradeAbility upgrade_ability = 10;
    AttackMove attack_move = 11;
    SetTowerTargetPriority set_tower_target_priority = 12;
    TogglePause toggle_pause = 13;
    ToggleGameSpeed toggle_game_speed = 14;
  }
}

// ===== Lockstep Wire Messages =====

// Tag 0x10 (C→S): client submits an input targeted at a future tick.
message InputSubmit {
  uint32 player_id = 1;
  uint32 target_tick = 2;
  PlayerInput input = 3;
  uint32 input_id = 4;
}

// ServerEvent — non-input events server injects into ticks (player join/leave, scripted scene start, etc.)
message PlayerJoinEvent { uint32 player_id = 1; string player_name = 2; }
message PlayerLeaveEvent { uint32 player_id = 1; }
message WaveStartEvent { uint32 wave_index = 1; }
message GameEndEvent { string winner = 1; }

message ServerEvent {
  oneof event {
    PlayerJoinEvent player_join = 1;
    PlayerLeaveEvent player_leave = 2;
    WaveStartEvent wave_start = 3;
    GameEndEvent game_end = 4;
  }
}

message InputForPlayer {
  uint32 player_id = 1;
  PlayerInput input = 2;
  uint32 input_id = 3;
  uint32 server_receive_tick = 4;
  uint32 server_drain_tick = 5;
  uint64 server_queue_us = 6;
}

// Tag 0x11 (S→C): server-paced tick broadcast. Sent at the GameStart.step_fps
// cadence even if inputs and server_events are both empty (heartbeat).
message TickBatch {
  uint32 tick = 1;
  repeated InputForPlayer inputs = 2;
  repeated ServerEvent server_events = 3;
  uint64 lua_content_generation = 4;
  string lua_content_hash = 5;
}

// Tag 0x12 (S→C): broadcast about every 10s for desync detection.
// Clients hash their local sim state at this tick and compare; mismatch → kick.
message StateHash {
  uint32 tick = 1;
  uint64 hash = 2;
}

// Tag 0x13 (C→S): client wants to join. role: 0=Player, 1=Observer.
enum JoinRole {
  ROLE_UNSPECIFIED = 0;
  ROLE_PLAYER = 1;
  ROLE_OBSERVER = 2;
}

message JoinRequest {
  string player_name = 1;
  JoinRole role = 2;
  // Client-declared player id. Player clients must provide a non-zero id
  // before connecting; server validates and echoes it in GameStart.
  uint32 player_id = 3;
}

// Tag 0x14 (S→C): response to JoinRequest. Includes master_seed and an
// initial SimSnapshot to bootstrap the client.
message GameStart {
  uint32 player_id = 1;          // validated client-declared player id
  uint32 start_tick = 2;
  uint64 master_seed = 3;
  SimSnapshot initial_state = 4;  // empty for fresh game start
  uint32 step_fps = 5;            // server-authoritative lockstep cadence
}

// Tag 0x15 (C→S): observer requests current snapshot.
message SnapshotReq {
  uint32 from_tick = 1;  // earliest tick observer can fast-forward from; server picks closest snapshot
}

// Tag 0x16 (S→C): server sends snapshot. observer plays forward via
// subsequent TickBatch broadcasts.
message SnapshotResp {
  uint32 tick = 1;
  SimSnapshot state = 2;
}

// Tag 0x17 (C→S): client RTT probe. `client_send_us` is the client's local
// monotonic timestamp in microseconds at send time. Server echoes it back
// in PingResponse without modification — client subtracts from `now` on
// receipt to derive round-trip time.
message PingRequest {
  int64 client_send_us = 1;
}

// Tag 0x18 (S→C): echo of PingRequest. Carries the unmodified client
// timestamp so the client can compute RTT without needing a clock-sync
// step. Server adds nothing.
message PingResponse {
  int64 client_send_us = 1;
}

// SimSnapshot — opaque bincode-serialized omoba_sim::World. Deserialized
// client-side via omoba_sim::snapshot::deserialize. Schema versioning
// embedded in the bincode payload.
message SimSnapshot {
  bytes world_bytes = 1;     // bincode-serialized omoba_sim sim state
  uint32 schema_version = 2; // for forward compatibility
}

message TestCommandRequest {
  string command_json = 1;
}

message TestCommandResponse {
  string response_json = 1;
}

message GameStateRequest {
  string query_type = 1;    // "list_players" | "inspect_player_view"
  string player_name = 2;
}

message GameStateResponse {
  bool success = 1;
  string error = 2;
  bytes data_json = 3;
}

message ViewportUpdate {
  float center_x = 1;
  float center_y = 2;
  float half_width = 3;
  float half_height = 4;
}
