<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="BTD style split TD UI mockup">
  <defs>
    <linearGradient id="grass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ee34b"/>
      <stop offset="0.55" stop-color="#6fc83a"/>
      <stop offset="1" stop-color="#4fa528"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c99854"/>
      <stop offset="1" stop-color="#9c672f"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfefff"/>
      <stop offset="1" stop-color="#27aee4"/>
    </linearGradient>
    <linearGradient id="greenBtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dff20"/>
      <stop offset="1" stop-color="#22b900"/>
