  <path d="M1074 638 L1036 670 L1062 670 L1046 694 L1088 657 L1062 659 Z" fill="#fff"/>
  <rect x="1128" y="625" width="108" height="74" rx="18" fill="url(#greenBtn)" stroke="#ffffff" stroke-width="6" filter="url(#shadow)"/>
