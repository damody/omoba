<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="BTD style split TD UI 1920x1080 layout contract">
  <defs>
    <linearGradient id="grass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ee34b"/>
      <stop offset="0.55" stop-color="#6fc83a"/>
      <stop offset="1" stop-color="#4fa528"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c99854"/>
      <stop offset="1" stop-color="#9c672f"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfefff"/>
      <stop offset="1" stop-color="#27aee4"/>
    </linearGradient>
    <linearGradient id="greenBtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dff20"/>
      <stop offset="1" stop-color="#22b900"/>
    </linearGradient>
    <linearGradient id="upgradeBtn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b86b25"/>
      <stop offset="0.52" stop-color="#a06832"/>
      <stop offset="1" stop-color="#43db00"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.32"/>
    </filter>
    <clipPath id="shopViewport">
      <rect x="1500" y="170" width="360" height="745" rx="18"/>
    </clipPath>
    <style>
      .font { font-family: "Segoe UI", "Microsoft JhengHei", sans-serif; }
      .outline { paint-order: stroke; stroke: #000; stroke-width: 7px; stroke-linejoin: round; }
      .small-outline { paint-order: stroke; stroke: #000; stroke-width: 4px; stroke-linejoin: round; }
      .label { font-size: 24px; font-weight: 900; fill: #fff; }
      .note { font-size: 22px; font-weight: 800; fill: #3b230c; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#grass)"/>
  <path d="M450 315 C630 180 810 195 915 345 S1230 495 1410 330" fill="none" stroke="#b5b7a9" stroke-width="93" stroke-linecap="round" opacity="0.82"/>
  <path d="M462 315 C638 198 800 213 903 353 S1226 480 1392 336" fill="none" stroke="#d9dccf" stroke-width="63" stroke-linecap="round" opacity="0.82"/>
  <circle cx="1058" cy="585" r="213" fill="#3b7c2f" opacity="0.22" stroke="#1f5024" stroke-width="5"/>
  <g class="font" opacity="0.9">
    <text class="small-outline" x="700" y="81" font-size="51" font-weight="900" fill="#fff">Lives 200</text>
    <text class="small-outline" x="930" y="81" font-size="51" font-weight="900" fill="#fff">$380</text>
    <text class="small-outline" x="1353" y="81" font-size="51" font-weight="900" fill="#fff">1/40</text>
  </g>

  <g id="context-left-anchor" class="font">
    <rect x="24" y="45" width="426" height="990" rx="36" fill="url(#wood)" stroke="#6e421d" stroke-width="6" filter="url(#shadow)"/>
    <rect x="48" y="72" width="378" height="63" rx="18" fill="#8a562b" opacity="0.72"/>
    <text class="small-outline" x="108" y="118" font-size="36" font-weight="900" fill="#fff">選中塔面板</text>
    <rect x="378" y="77" width="39" height="39" rx="9" fill="#6e421d" opacity="0.7"/>
    <text x="389" y="109" font-size="33" font-weight="900" fill="#f4d3a0">x</text>

    <rect x="63" y="158" width="348" height="255" rx="21" fill="#9fe5ff" stroke="#49a9d4" stroke-width="6"/>
    <circle cx="237" cy="275" r="87" fill="#f9cc2c" stroke="#7a3e00" stroke-width="6"/>
    <path d="M183 240 L272 189 L303 258 L252 353 L168 327 Z" fill="#ffd900" opacity="0.95"/>
    <path d="M222 189 L248 306" stroke="#fa1c14" stroke-width="20" stroke-linecap="round"/>
    <text class="small-outline" x="160" y="389" font-size="39" font-weight="900" fill="#fff">飛鏢猴</text>
    <circle cx="87" cy="188" r="36" fill="#00bfff" stroke="#fff" stroke-width="8"/>
    <text x="77" y="203" font-size="42" font-weight="900" fill="#fff">i</text>

    <text x="72" y="458" font-size="23" font-weight="800" fill="#543111">升級路線與出售在 context panel 內</text>
    <g>
      <g transform="translate(57 480)">
        <rect width="357" height="117" rx="24" fill="url(#upgradeBtn)" stroke="#5a3619" stroke-width="6"/>
        <rect x="15" y="18" width="72" height="81" rx="15" fill="#6b3d1c" opacity="0.55"/>
        <path d="M38 80 C68 45 72 39 84 30" fill="none" stroke="#d87918" stroke-width="18" stroke-linecap="round"/>
        <text class="small-outline" x="114" y="46" font-size="30" font-weight="900" fill="#fff">P1 L0-&gt;L1</text>
        <text class="small-outline" x="114" y="91" font-size="33" font-weight="900" fill="#fff">長距攻擊 $85</text>
      </g>
      <g transform="translate(57 615)">
        <rect width="357" height="117" rx="24" fill="url(#upgradeBtn)" stroke="#5a3619" stroke-width="6"/>
        <rect x="15" y="18" width="72" height="81" rx="15" fill="#6b3d1c" opacity="0.55"/>
        <path d="M33 75 L83 33 L95 83" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
        <text class="small-outline" x="114" y="46" font-size="30" font-weight="900" fill="#fff">P2 L0-&gt;L1</text>
        <text class="small-outline" x="114" y="91" font-size="33" font-weight="900" fill="#fff">快速投擲 $150</text>
      </g>
      <g transform="translate(57 750)">
        <rect width="357" height="117" rx="24" fill="url(#upgradeBtn)" stroke="#5a3619" stroke-width="6"/>
        <rect x="15" y="18" width="72" height="81" rx="15" fill="#6b3d1c" opacity="0.55"/>
        <path d="M36 84 C51 54 65 51 87 27" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
        <text class="small-outline" x="114" y="46" font-size="30" font-weight="900" fill="#fff">P3 L0-&gt;L1</text>
        <text class="small-outline" x="114" y="91" font-size="33" font-weight="900" fill="#fff">銳利雙眼 $50</text>
      </g>
    </g>
    <rect x="57" y="915" width="177" height="78" rx="12" fill="#6d391b" opacity="0.85"/>
    <text class="small-outline" x="82" y="968" font-size="42" font-weight="900" fill="#fff">$189</text>
    <rect x="255" y="900" width="159" height="99" rx="27" fill="#ff5c00" stroke="#fff" stroke-width="8" filter="url(#shadow)"/>
    <text class="small-outline" x="298" y="963" font-size="45" font-weight="900" fill="#fff">出售</text>
  </g>

  <g id="context-right-anchor-reference" class="font" opacity="0.5">
    <rect x="1053" y="45" width="426" height="990" rx="36" fill="#fff3" stroke="#fff" stroke-width="6" stroke-dasharray="18 14"/>
    <text class="small-outline" x="1095" y="112" font-size="30" font-weight="900" fill="#fff">右錨點：選中左半邊塔時使用</text>
    <text class="small-outline" x="1128" y="160" font-size="24" font-weight="900" fill="#fff">x=1053 y=45 w=426 h=990</text>
  </g>

  <g id="right-shop-panel" class="font">
    <rect x="1479" y="0" width="405" height="1080" fill="url(#wood)" stroke="#6e421d" stroke-width="6" filter="url(#shadow)"/>
    <rect x="1506" y="33" width="351" height="96" rx="27" fill="url(#greenBtn)" stroke="#ffffff" stroke-width="8"/>
    <text class="small-outline" x="1620" y="95" font-size="45" font-weight="900" fill="#fff">買塔</text>
    <rect x="1503" y="124" width="357" height="40" rx="12" fill="#8a562b" opacity="0.82"/>
    <text class="small-outline" x="1590" y="155" font-size="30" font-weight="900" fill="#fff">塔商店</text>
    <rect x="1500" y="170" width="360" height="745" rx="18" fill="#5a3518" opacity="0.28" stroke="#e3b066" stroke-width="4"/>

    <g clip-path="url(#shopViewport)">
      <g transform="translate(1508 170)">
        <rect width="158" height="160" rx="14" fill="url(#blueCard)" stroke="#127aa4" stroke-width="5"/>
        <circle cx="79" cy="58" r="42" fill="#f9cc2c" stroke="#7a3e00" stroke-width="4"/>
        <path d="M64 25 L73 92" stroke="#fa1c14" stroke-width="10" stroke-linecap="round"/>
        <text class="small-outline" x="30" y="130" font-size="24" font-weight="900" fill="#fff">$270</text>
      </g>
      <g transform="translate(1674 170)">
        <rect width="158" height="160" rx="14" fill="url(#blueCard)" stroke="#127aa4" stroke-width="5"/>
        <circle cx="79" cy="58" r="43" fill="#20232a" stroke="#0b0c10" stroke-width="4"/>
        <rect x="42" y="43" width="74" height="32" rx="12" fill="#4b3d7d"/>
        <text class="small-outline" x="30" y="130" font-size="24" font-weight="900" fill="#fff">$320</text>
      </g>
      <g transform="translate(1508 332)">
        <rect width="158" height="160" rx="14" fill="url(#blueCard)" stroke="#127aa4" stroke-width="5"/>
        <circle cx="79" cy="58" r="43" fill="#e65ab2" stroke="#7a1c52" stroke-width="4"/>
        <text class="small-outline" x="30" y="130" font-size="24" font-weight="900" fill="#fff">$220</text>
      </g>
      <g transform="translate(1674 332)">
        <rect width="158" height="160" rx="14" fill="url(#blueCard)" stroke="#127aa4" stroke-width="5" opacity="0.65"/>
        <path d="M50 98 L112 32" stroke="#ffffff" stroke-width="17" stroke-linecap="round" opacity="0.85"/>
        <text class="small-outline" x="30" y="130" font-size="24" font-weight="900" fill="#fff">$340</text>
      </g>
      <g transform="translate(1508 494)">
        <rect width="158" height="160" rx="14" fill="#55e238" stroke="#178a1c" stroke-width="5"/>
        <circle cx="79" cy="58" r="43" fill="#c97923" stroke="#7a3e00" stroke-width="4"/>
        <text class="small-outline" x="30" y="130" font-size="24" font-weight="900" fill="#fff">$300</text>
      </g>
      <g transform="translate(1674 494)">
        <rect width="158" height="160" rx="14" fill="#55e238" stroke="#178a1c" stroke-width="5" opacity="0.72"/>
        <path d="M38 86 L122 50" stroke="#7fc7ff" stroke-width="21" stroke-linecap="round"/>
        <text class="small-outline" x="30" y="130" font-size="24" font-weight="900" fill="#fff">$275</text>
      </g>
    </g>
    <rect x="1857" y="170" width="18" height="745" rx="9" fill="#3f240f" opacity="0.75"/>
    <rect x="1859" y="188" width="14" height="210" rx="7" fill="#ffd15c" stroke="#fff" stroke-width="3"/>
    <text x="1506" y="912" font-size="23" font-weight="800" fill="#4b2a10">shop viewport scrolls; controls stay fixed</text>
    <rect x="1508" y="938" width="162" height="111" rx="27" fill="#ffcf00" stroke="#ffffff" stroke-width="9" filter="url(#shadow)"/>
    <path d="M1611 957 L1554 1005 L1593 1005 L1569 1041 L1632 986 L1593 989 Z" fill="#fff"/>
    <rect x="1692" y="938" width="162" height="111" rx="27" fill="url(#greenBtn)" stroke="#ffffff" stroke-width="9" filter="url(#shadow)"/>
    <path d="M1746 966 L1746 1023 L1803 995 Z" fill="#fff"/>
  </g>

  <text class="font" x="630" y="1020" font-size="27" font-weight="800" fill="#154113">Map remains center; context panel swaps sides by selected tower x, right panel always handles shop/start/pause.</text>
</svg>
