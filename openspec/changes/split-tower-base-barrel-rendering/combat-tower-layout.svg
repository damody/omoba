<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Composite tower combat rendering concept">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe8a8"/>
      <stop offset="1" stop-color="#b8f27a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="1" stop-color="#f4c77a"/>
    </linearGradient>
    <linearGradient id="cookie" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1bf6d"/>
      <stop offset="1" stop-color="#a9672a"/>
    </linearGradient>
    <linearGradient id="frost" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7fb"/>
      <stop offset="1" stop-color="#8fd8ff"/>
    </linearGradient>
    <linearGradient id="candy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8fb5"/>
      <stop offset="1" stop-color="#c4004f"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#47240e"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <style>
      .font { font-family: Segoe UI, Arial, sans-serif; }
      .title { font-size: 34px; font-weight: 900; fill: #3b220d; }
      .label { font-size: 24px; font-weight: 800; fill: #3b220d; }
      .small { font-size: 18px; font-weight: 700; fill: #4c2c11; }
      .note { font-size: 16px; font-weight: 650; fill: #5a3619; }
      .outline { stroke: #3b220d; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
      .thin { stroke: #3b220d; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text class="font title" x="56" y="64">Composite tower combat rendering intent</text>
  <text class="font small" x="58" y="96">Dessert-war assets live in scripts/base_content/assets/towers/. Runtime composes base + barrel or no-barrel body frames; backend attack phases drive animation.</text>
  <g transform="translate(58 108)">
    <rect x="0" y="0" width="520" height="18" rx="9" fill="#fff4c6" stroke="#7a461c" stroke-width="2"/>
    <rect x="0" y="0" width="175" height="18" rx="9" fill="#7fd0ff" opacity="0.85"/>
    <rect x="175" y="0" width="35" height="18" fill="#ffcf00" opacity="0.95"/>
    <rect x="210" y="0" width="310" height="18" rx="9" fill="#ff8fb5" opacity="0.75"/>
    <text class="font note" x="12" y="36">windup: frontend animation starts</text>
    <text class="font note" x="182" y="36">impact</text>
    <text class="font note" x="260" y="36">backswing: recover</text>
  </g>

  <rect x="48" y="130" width="690" height="700" rx="28" fill="url(#panel)" stroke="#6b3b17" stroke-width="5" filter="url(#shadow)"/>
  <text class="font label" x="82" y="180">A. Target-facing tower</text>
  <text class="font note" x="84" y="210">Example: dart, bomb, ice</text>

  <g id="target-facing" transform="translate(370 435)">
    <circle r="110" fill="#3e8f3a" opacity="0.22" stroke="#27622a" stroke-width="4" stroke-dasharray="10 8"/>
    <ellipse cx="0" cy="32" rx="112" ry="72" fill="#000" opacity="0.10"/>
    <g id="base" filter="url(#shadow)">
      <circle cx="0" cy="0" r="86" fill="url(#cookie)" class="outline"/>
      <circle cx="0" cy="0" r="60" fill="#fff0be" stroke="#6f3d16" stroke-width="5"/>
      <circle cx="-38" cy="-24" r="9" fill="#ff8fb5"/>
      <circle cx="36" cy="-22" r="9" fill="#79d7ff"/>
      <circle cx="-20" cy="38" r="8" fill="#8ce16a"/>
      <circle cx="42" cy="28" r="8" fill="#ffd15c"/>
    </g>
    <g id="barrel" transform="rotate(35)" filter="url(#shadow)">
      <rect x="-24" y="-132" width="48" height="118" rx="18" fill="url(#candy)" class="outline"/>
      <rect x="-18" y="-122" width="36" height="44" rx="12" fill="#fff7fb" opacity="0.72"/>
      <path d="M-18 -116 L18 -82" stroke="#ffffff" stroke-width="8" opacity="0.65"/>
      <circle cx="0" cy="-8" r="32" fill="#fff0be" class="thin"/>
    </g>
    <line x1="70" y1="-82" x2="172" y2="-204" stroke="#47240e" stroke-width="6" marker-end="url(#arrow)"/>
    <circle cx="205" cy="-240" r="30" fill="#8e50ff" class="outline"/>
    <text class="font small" x="158" y="-288">target</text>
  </g>

  <g transform="translate(88 600)">
    <rect x="0" y="0" width="596" height="160" rx="18" fill="#fff4c6" stroke="#7a461c" stroke-width="3"/>
    <text class="font small" x="24" y="38">rotation_mode = targeted</text>
    <text class="font small" x="24" y="72">barrel uses snapshot aim/facing, not frontend target picking</text>
    <text class="font small" x="24" y="106">barrel_frames start at windup; fire frame aligns to impact</text>
    <line x1="390" y1="82" x2="510" y2="82" stroke="#47240e" stroke-width="7" marker-end="url(#arrow)"/>
    <line x1="510" y1="112" x2="390" y2="112" stroke="#c4004f" stroke-width="7" marker-end="url(#arrow)"/>
    <text class="font note" x="368" y="140">fire direction / recoil back</text>
  </g>

  <g transform="translate(88 772)">
    <text class="font note" x="0" y="0">No-barrel area tower: render_mode = animated_area, body frames loop/attack from windup, no target-facing barrel.</text>
  </g>

  <rect x="820" y="130" width="730" height="700" rx="28" fill="url(#panel)" stroke="#6b3b17" stroke-width="5" filter="url(#shadow)"/>
  <text class="font label" x="854" y="180">B. Tack shooter radial variants</text>
  <text class="font note" x="856" y="210">Fixed rotation, count changes with upgrade_levels, recoil uses scale_pulse.</text>

  <g id="tack-variants" transform="translate(0 0)">
    <g transform="translate(965 390)">
      <text class="font small" x="-64" y="-130">8 barrels</text>
      <circle r="72" fill="url(#cookie)" class="outline"/>
      <circle r="48" fill="#fff0be" class="thin"/>
      <g stroke="#d12f5f" stroke-width="10" stroke-linecap="round">
        <line x1="0" y1="0" x2="0" y2="-72"/>
        <line x1="0" y1="0" x2="51" y2="-51"/>
        <line x1="0" y1="0" x2="72" y2="0"/>
        <line x1="0" y1="0" x2="51" y2="51"/>
        <line x1="0" y1="0" x2="0" y2="72"/>
        <line x1="0" y1="0" x2="-51" y2="51"/>
        <line x1="0" y1="0" x2="-72" y2="0"/>
        <line x1="0" y1="0" x2="-51" y2="-51"/>
      </g>
      <circle r="25" fill="#8fd8ff" class="thin"/>
      <text class="font note" x="-78" y="120">default / early</text>
    </g>

    <g transform="translate(1188 390)">
      <text class="font small" x="-74" y="-130">12 barrels</text>
      <circle r="72" fill="url(#cookie)" class="outline"/>
      <circle r="48" fill="#fff0be" class="thin"/>
      <g stroke="#d12f5f" stroke-width="8" stroke-linecap="round">
        <line x1="0" y1="0" x2="0" y2="-74"/>
        <line x1="0" y1="0" x2="37" y2="-64"/>
        <line x1="0" y1="0" x2="64" y2="-37"/>
        <line x1="0" y1="0" x2="74" y2="0"/>
        <line x1="0" y1="0" x2="64" y2="37"/>
        <line x1="0" y1="0" x2="37" y2="64"/>
        <line x1="0" y1="0" x2="0" y2="74"/>
        <line x1="0" y1="0" x2="-37" y2="64"/>
        <line x1="0" y1="0" x2="-64" y2="37"/>
        <line x1="0" y1="0" x2="-74" y2="0"/>
        <line x1="0" y1="0" x2="-64" y2="-37"/>
        <line x1="0" y1="0" x2="-37" y2="-64"/>
      </g>
      <circle r="25" fill="#8fd8ff" class="thin"/>
      <text class="font note" x="-80" y="120">more needles</text>
    </g>

    <g transform="translate(1410 390)">
      <text class="font small" x="-74" y="-130">16 barrels</text>
      <circle r="72" fill="url(#cookie)" class="outline"/>
      <circle r="48" fill="#fff0be" class="thin"/>
      <g stroke="#d12f5f" stroke-width="7" stroke-linecap="round">
        <line x1="0" y1="0" x2="0" y2="-76"/>
        <line x1="0" y1="0" x2="29" y2="-70"/>
        <line x1="0" y1="0" x2="54" y2="-54"/>
        <line x1="0" y1="0" x2="70" y2="-29"/>
        <line x1="0" y1="0" x2="76" y2="0"/>
        <line x1="0" y1="0" x2="70" y2="29"/>
        <line x1="0" y1="0" x2="54" y2="54"/>
        <line x1="0" y1="0" x2="29" y2="70"/>
        <line x1="0" y1="0" x2="0" y2="76"/>
        <line x1="0" y1="0" x2="-29" y2="70"/>
        <line x1="0" y1="0" x2="-54" y2="54"/>
        <line x1="0" y1="0" x2="-70" y2="29"/>
        <line x1="0" y1="0" x2="-76" y2="0"/>
        <line x1="0" y1="0" x2="-70" y2="-29"/>
        <line x1="0" y1="0" x2="-54" y2="-54"/>
        <line x1="0" y1="0" x2="-29" y2="-70"/>
      </g>
      <circle r="25" fill="#8fd8ff" class="thin"/>
      <text class="font note" x="-80" y="120">dense needles</text>
    </g>
  </g>

  <g transform="translate(870 600)">
    <rect x="0" y="0" width="625" height="160" rx="18" fill="#fff4c6" stroke="#7a461c" stroke-width="3"/>
    <text class="font small" x="24" y="38">rotation_mode = fixed</text>
    <text class="font small" x="24" y="72">barrel_layout = radial_count_variants</text>
    <text class="font small" x="24" y="106">upgrade_levels select 8 / 12 / 16 barrel texture</text>
    <text class="font small" x="24" y="140">variant barrel_frames animate; scale_pulse shrinks then pops back</text>
    <circle cx="535" cy="78" r="42" fill="#ff8fb5" opacity="0.55" stroke="#c4004f" stroke-width="4"/>
    <circle cx="535" cy="78" r="30" fill="#ff8fb5" opacity="0.85" stroke="#c4004f" stroke-width="4"/>
    <text class="font note" x="492" y="140">scale pulse</text>
  </g>
</svg>
